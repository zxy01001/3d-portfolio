      <text x="410" y="614" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">1116px</text>
      <rect x="640" y="594" width="120" height="26" rx="13" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="700" y="612" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">Zone 1</text>
      <text x="880" y="614" font-weight="700" fill="#a5b4fc">5 列</text>
      <text x="1090" y="614" font-family="ui-monospace, monospace" fill="#cbd5e1">206px / 张</text>
      <text x="1310" y="614" fill="#94a3b8">左分类树/热榜 + 右主陈列矩阵</text>

      <!-- Row 4 -->
      <line x1="100" y1="636" x2="1500" y2="636" stroke="#1e293b"/>
      <text x="116" y="674" font-weight="700" fill="#f8fafc">1 : 1 双等分栏</text>
      <text x="410" y="674" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">744px</text>
      <rect x="640" y="654" width="120" height="26" rx="13" fill="#0369a1" fill-opacity="0.28" stroke="#38bdf8" stroke-opacity="0.5"/>
