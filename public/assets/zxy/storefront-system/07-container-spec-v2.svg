      <text x="410" y="494" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">1500px</text>
      <rect x="640" y="474" width="120" height="26" rx="13" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5"/>
