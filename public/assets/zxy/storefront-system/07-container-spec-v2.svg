        <line x1="8" y1="74" x2="8" y2="84" stroke="#64748b" stroke-width="1.5"/>
        <text x="8" y="102" text-anchor="middle">280px</text>

        <line x1="207" y1="74" x2="207" y2="84" stroke="#2dd4bf" stroke-width="1.5"/>
