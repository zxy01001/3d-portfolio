<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d1f"/>
      <stop offset="55%" stop-color="#0d1836"/>
      <stop offset="100%" stop-color="#091228"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.86" cy="0.82" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="z5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="z4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="z3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="z2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="z1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <!-- Header -->
  <g font-family="'PingFang SC', 'Hiragino Sans GB', -apple-system, sans-serif">
    <text x="76" y="72" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2.5">DESIGN-TO-CODE SPECIFICATION · CONTAINER QUERY V2.0</text>
    <text x="76" y="114" font-size="32" font-weight="800" fill="#f8fafc">商品卡片网格 · 容器级响应式断点区间契约</text>
    <text x="76" y="144" font-size="15" font-weight="400" fill="#94a3b8">摒弃传统视口断点（Viewport Media Query），基于父分栏容器宽度建立统一公式：最小单卡 ≥ 200px · 栏内间距 12px · 容器内边距 20px · 无缝适配 8 种低代码分栏骨架</text>

    <rect x="1296" y="84" width="228" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="1410" y="108" font-size="13" font-weight="700" fill="#bae6fd" text-anchor="middle">前端栅格技术契约 · V2.0</text>

    <!-- Section 1: Breakpoint Axis Map -->
    <rect x="76" y="182" width="4" height="20" rx="2" fill="#38bdf8"/>
    <text x="90" y="198" font-size="18" font-weight="700" fill="#e2e8f0">01 · 容器宽度断点区间分布轴线（Container Breakpoint Axis Map）</text>

    <!-- 5 Zones Bar (x=76..1524, total width = 1448) -->
    <g transform="translate(76, 218)">
      <rect x="0" y="0" width="204" height="66" rx="12" fill="url(#z5)" stroke="#64748b" stroke-opacity="0.5"/>
      <text x="102" y="29" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">Zone 5 · 1 列</text>
      <text x="102" y="50" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1" text-anchor="middle">280 – 452px</text>

      <rect x="210" y="0" width="246" height="66" rx="12" fill="url(#z4)" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="333" y="29" font-size="15" font-weight="700" fill="#f0fdfa" text-anchor="middle">Zone 4 · 2 列</text>
      <text x="333" y="50" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ccfbf1" text-anchor="middle">452 – 664px</text>

      <rect x="462" y="0" width="256" height="66" rx="12" fill="url(#z3)" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="590" y="29" font-size="15" font-weight="700" fill="#f0f9ff" text-anchor="middle">Zone 3 · 3 列</text>
      <text x="590" y="50" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#bae6fd" text-anchor="middle">664 – 876px</text>

      <rect x="724" y="0" width="266" height="66" rx="12" fill="url(#z2)" stroke="#60a5fa" stroke-opacity="0.5"/>
      <text x="857" y="29" font-size="15" font-weight="700" fill="#eff6ff" text-anchor="middle">Zone 2 · 4 列</text>
      <text x="857" y="50" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#bfdbfe" text-anchor="middle">876 – 1088px</text>

      <rect x="996" y="0" width="452" height="66" rx="12" fill="url(#z1)" stroke="#818cf8" stroke-opacity="0.55"/>
      <text x="1222" y="29" font-size="15" font-weight="700" fill="#eef2ff" text-anchor="middle">Zone 1 · 5 列（主通栏满血态）</text>
      <text x="1222" y="50" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ddd6fe" text-anchor="middle">1088 – 1500px</text>

