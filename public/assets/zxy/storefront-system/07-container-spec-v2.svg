      <text x="880" y="674" font-weight="700" fill="#38bdf8">3 列</text>
      <text x="1090" y="674" font-family="ui-monospace, monospace" fill="#cbd5e1">227px / 张</text>
      <text x="1310" y="674" fill="#94a3b8">新品专区 vs 常购清单并置对比</text>

      <!-- Row 5 -->
      <line x1="100" y1="696" x2="1500" y2="696" stroke="#1e293b"/>
      <text x="116" y="734" font-weight="700" fill="#f8fafc">1 : 2 : 1 中栏容器</text>
      <text x="410" y="734" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">738px</text>
      <rect x="640" y="714" width="120" height="26" rx="13" fill="#0369a1" fill-opacity="0.28" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="700" y="732" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">Zone 3</text>
      <text x="880" y="734" font-weight="700" fill="#38bdf8">3 列</text>
      <text x="1090" y="734" font-family="ui-monospace, monospace" fill="#cbd5e1">225px / 张</text>
      <text x="1310" y="734" fill="#94a3b8">三栏门户核心区商品聚合</text>

      <!-- Row 6 -->
      <line x1="100" y1="756" x2="1500" y2="756" stroke="#1e293b"/>
      <text x="116" y="794" font-weight="700" fill="#f8fafc">2 : 1 : 1 主栏容器</text>
      <text x="410" y="794" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">738px</text>
      <rect x="640" y="774" width="120" height="26" rx="13" fill="#0369a1" fill-opacity="0.28" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="700" y="792" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">Zone 3</text>
      <text x="880" y="794" font-weight="700" fill="#38bdf8">3 列</text>
      <text x="1090" y="794" font-family="ui-monospace, monospace" fill="#cbd5e1">225px / 张</text>
      <text x="1310" y="794" fill="#94a3b8">主品类推荐 + 双辅助工单/财务卡</text>

      <!-- Row 7 -->
      <line x1="100" y1="816" x2="1500" y2="816" stroke="#1e293b"/>
      <text x="116" y="854" font-weight="700" fill="#f8fafc">3 : 1 窄侧栏容器</text>
      <text x="410" y="854" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">372px</text>
      <rect x="640" y="834" width="120" height="26" rx="13" fill="#334155" fill-opacity="0.6" stroke="#94a3b8" stroke-opacity="0.45"/>
      <text x="700" y="852" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Zone 5</text>
      <text x="880" y="854" font-weight="700" fill="#2dd4bf">1 列</text>
      <text x="1090" y="854" font-family="ui-monospace, monospace" fill="#cbd5e1">332px / 张</text>
      <text x="1310" y="854" fill="#94a3b8">限时秒杀单列排行 / 补货推荐栏</text>

      <!-- Row 8 -->
      <line x1="100" y1="876" x2="1500" y2="876" stroke="#1e293b"/>
      <text x="116" y="914" font-weight="700" fill="#f8fafc">1 : 2 : 1 侧翼窄栏</text>
      <text x="410" y="914" font-family="ui-monospace, monospace" font-weight="700" fill="#e2e8f0">369px</text>
      <rect x="640" y="894" width="120" height="26" rx="13" fill="#334155" fill-opacity="0.6" stroke="#94a3b8" stroke-opacity="0.45"/>
      <text x="700" y="912" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">Zone 5</text>
      <text x="880" y="914" font-weight="700" fill="#2dd4bf">1 列</text>
      <text x="1090" y="914" font-family="ui-monospace, monospace" fill="#cbd5e1">329px / 张</text>
