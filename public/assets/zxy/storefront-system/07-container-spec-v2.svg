    <rect x="76" y="362" width="4" height="20" rx="2" fill="#818cf8"/>
    <text x="90" y="378" font-size="18" font-weight="700" fill="#e2e8f0">02 · 低代码分栏骨架 × 容器栏宽 × 卡片列数映射矩阵（Max Content 1500px · Gutter 12px）</text>

    <rect x="76" y="400" width="1448" height="544" rx="20" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.5"/>

    <!-- Table Header -->
    <rect x="76" y="400" width="1448" height="56" rx="20" fill="#1e293b" fill-opacity="0.8"/>
    <g font-size="14" font-weight="700" fill="#94a3b8">
