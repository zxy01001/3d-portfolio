<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1066" viewBox="0 0 1600 1066">
  <defs>
    <linearGradient id="dsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b1324"/>
    </linearGradient>
    <radialGradient id="dsg" cx="0.75" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#4263eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1066" fill="url(#dsbg)"/>
  <rect width="1600" height="1066" fill="url(#dsg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1066"/><line x1="640" y1="0" x2="640" y2="1066"/>
    <line x1="960" y1="0" x2="960" y2="1066"/><line x1="1280" y1="0" x2="1280" y2="1066"/>
  </g>
  <!-- Top bar -->
  <rect x="96" y="84" width="1408" height="148" rx="26" fill="#162038" stroke="#334155" stroke-width="1.5"/>
  <text x="144" y="142" fill="#94a3b8" font-family="Inter, PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="3">DESIGN SYSTEM ARCHITECTURE · WEB &amp; MOBILE</text>
  <text x="144" y="194" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="38" font-weight="700">Figma 双端组件库与 Axure 原型资产体系</text>
  <rect x="1080" y="116" width="180" height="84" rx="18" fill="#1e293b" stroke="#4263eb" stroke-width="1.5"/>
  <text x="1170" y="156" text-anchor="middle" fill="#60a5fa" font-family="Inter, sans-serif" font-size="34" font-weight="800">92%</text>
  <text x="1170" y="184" text-anchor="middle" fill="#cbd5e1" font-family="PingFang SC, sans-serif" font-size="16">业务组件覆盖率</text>
  <rect x="1280" y="116" width="180" height="84" rx="18" fill="#1e293b" stroke="#2fc5c9" stroke-width="1.5"/>
  <text x="1370" y="156" text-anchor="middle" fill="#2dd4bf" font-family="Inter, sans-serif" font-size="34" font-weight="800">+30%</text>
  <text x="1370" y="184" text-anchor="middle" fill="#cbd5e1" font-family="PingFang SC, sans-serif" font-size="16">团队设计提效</text>

  <!-- Layer 1: Design Tokens -->
  <rect x="96" y="272" width="440" height="680" rx="26" fill="#131c31" stroke="#334155" stroke-width="1.5"/>
  <text x="136" y="330" fill="#818cf8" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="2">01 · DESIGN TOKENS</text>
  <text x="136" y="370" fill="#ffffff" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700">基础语义变量</text>
  <rect x="136" y="408" width="76" height="76" rx="16" fill="#4263eb"/><rect x="228" y="408" width="76" height="76" rx="16" fill="#2fc5c9"/>
  <rect x="320" y="408" width="76" height="76" rx="16" fill="#10b981"/><rect x="412" y="408" width="84" height="76" rx="16" fill="#06b6d4"/>
  <rect x="136" y="514" width="360" height="96" rx="16" fill="#1e293b"/>
  <text x="162" y="556" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600">Typography 字阶规范</text>
  <text x="162" y="588" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">12 / 14 / 16 / 20 / 24 / 32px · 行高与字重矩阵</text>
  <rect x="136" y="634" width="360" height="96" rx="16" fill="#1e293b"/>
  <text x="162" y="676" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600">Spacing &amp; Radius 栅格间距</text>
  <text x="162" y="708" fill="#94a3b8" font-family="Inter, sans-serif" font-size="16">4px 基准模数 · 圆角与阴影层级统一</text>
  <rect x="136" y="754" width="360" height="156" rx="16" fill="#1e293b"/>
  <text x="162" y="796" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600">State Semantics 状态色规范</text>
  <text x="162" y="832" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="16">默认 / 悬停 / 激活 / 禁用 / 校验告警</text>
  <text x="162" y="866" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="16">跨产品线消除视觉分叉</text>

