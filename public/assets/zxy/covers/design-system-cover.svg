  <rect x="576" y="272" width="468" height="680" rx="26" fill="#131c31" stroke="#4263eb" stroke-opacity="0.6" stroke-width="2"/>
  <text x="616" y="330" fill="#38bdf8" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="2">02 · COMPONENT VARIANTS</text>
  <text x="616" y="370" fill="#ffffff" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700">Web + Mobile 双端组件库</text>
  <rect x="616" y="408" width="388" height="120" rx="18" fill="#1e293b" stroke="#475569" stroke-dasharray="6 6"/>
  <rect x="640" y="432" width="110" height="42" rx="10" fill="#4263eb"/>
  <text x="695" y="459" text-anchor="middle" fill="#fff" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600">主要操作</text>
  <rect x="766" y="432" width="110" height="42" rx="10" fill="#0f172a" stroke="#64748b"/>
  <text x="821" y="459" text-anchor="middle" fill="#e2e8f0" font-family="PingFang SC, sans-serif" font-size="16">次要按钮</text>
  <rect x="892" y="432" width="90" height="42" rx="10" fill="#1e293b"/>
  <text x="937" y="459" text-anchor="middle" fill="#64748b" font-family="PingFang SC, sans-serif" font-size="16">禁用态</text>
  <text x="640" y="508" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">Auto Layout · Variants · Boolean &amp; Slot Props</text>

  <rect x="616" y="552" width="388" height="168" rx="18" fill="#1e293b"/>
  <text x="642" y="594" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="21" font-weight="600">高频 B 端复合组件</text>
  <text x="642" y="632" fill="#cbd5e1" font-family="PingFang SC, sans-serif" font-size="17">• 多维筛选栏 / 高密度数据表格 / 分页器</text>
  <text x="642" y="664" fill="#cbd5e1" font-family="PingFang SC, sans-serif" font-size="17">• 分步配置向导 / 抽屉详情 / 权限空状态</text>
  <text x="642" y="696" fill="#cbd5e1" font-family="PingFang SC, sans-serif" font-size="17">• AI 识别加载态 / 候选核对卡片</text>

  <rect x="616" y="744" width="388" height="166" rx="18" fill="#1e293b"/>
  <text x="642" y="786" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="21" font-weight="600">Axure 原型组件库同步</text>
  <text x="642" y="824" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">将交互规则前置到产品原型阶段，缩短</text>
  <text x="642" y="856" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">需求评审 → 视觉设计 → 前端走查链路</text>

  <!-- Layer 3: Governance -->
  <rect x="1084" y="272" width="420" height="680" rx="26" fill="#131c31" stroke="#334155" stroke-width="1.5"/>
  <text x="1124" y="330" fill="#2dd4bf" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="2">03 · COLLABORATION</text>
  <text x="1124" y="370" fill="#ffffff" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700">规范落地与团队治理</text>
  <rect x="1124" y="408" width="340" height="150" rx="18" fill="#1e293b"/>
  <text x="1150" y="452" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="21" font-weight="600">命名与变体标准</text>
  <text x="1150" y="490" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">统一层级结构、组件使用说明文档与</text>
  <text x="1150" y="522" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">新增/废弃维护流程</text>
  <rect x="1124" y="582" width="340" height="150" rx="18" fill="#1e293b"/>
  <text x="1150" y="626" fill="#f8fafc" font-family="PingFang SC, sans-serif" font-size="21" font-weight="600">团队宣讲与实战接入</text>
  <text x="1150" y="664" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">覆盖平台、消费品、智能 AI 三条核心</text>
  <text x="1150" y="696" fill="#94a3b8" font-family="PingFang SC, sans-serif" font-size="17">业务线日常迭代</text>
  <rect x="1124" y="756" width="340" height="154" rx="18" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="1150" y="802" fill="#93c5fd" font-family="PingFang SC, sans-serif" font-size="21" font-weight="700">走查验收闭环</text>
  <text x="1150" y="840" fill="#dbeafe" font-family="PingFang SC, sans-serif" font-size="17">显著减少跨页面样式与交互不一致，</text>
  <text x="1150" y="872" fill="#dbeafe" font-family="PingFang SC, sans-serif" font-size="17">建立可持续演进的设计资产</text>
</svg>